<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DAVID">
<title>DAVID — Body Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07111c; --card:#0d1e2d; --card2:#112436;
  --border:rgba(61,214,224,.12); --accent:#3dd6e0; --mint:#63d2b8; --gold:#f0c040;
  --fire:#ff6b35; --text:#e4f4f6; --dim:#7ab3bc; --muted:#2a4a58;
  --ok:#4ade80; --warn:#fbbf24; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;overflow-x:hidden}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,30,45,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe);z-index:100}
.nav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;transition:.2s}
.nav-icon{font-size:20px;line-height:1}
.nav-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:'Noto Sans JP',sans-serif}
.nav-btn.active .nav-label{color:var(--accent)}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.panel{display:none;padding:0 14px calc(84px + var(--safe)) 14px}
.panel.active{display:block}
.header{padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 0;background:linear-gradient(180deg,rgba(61,214,224,.07) 0%,transparent 100%);border-bottom:1px solid var(--border);margin-bottom:16px}
.header-inner{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.app-title{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);letter-spacing:4px;line-height:1}
.app-sub{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase}
.header-menu{font-size:11px;color:var(--dim);padding-bottom:12px}
.header-menu span{color:var(--text)}
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px}
.card+.card,.card+.paste-zone,.paste-zone+.card{margin-top:12px}
.hero-card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid rgba(240,192,64,.2);border-radius:16px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(240,192,64,.06),transparent 70%);pointer-events:none}
.hero-body{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.david-wrap{flex-shrink:0}
.hero-stats{flex:1}
.fat-now{margin-bottom:10px}
.fat-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-bottom:2px}
.fat-value{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--accent);line-height:1;letter-spacing:1px}
.fat-value span{font-size:18px;color:var(--dim)}
.fat-remaining{font-size:12px;color:var(--dim);margin-top:2px}
.fat-remaining b{color:var(--gold);font-size:16px}
.wt-now{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--mint);letter-spacing:1px}
.wt-now span{font-size:13px;color:var(--dim)}
.prog-section{margin-top:4px}
.prog-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px}
.prog-row b{color:var(--gold)}
.prog-track{background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.prog-track.fat-track{height:11px;margin-bottom:10px}
.prog-track.day-track{height:6px}
.prog-fill{height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.fat-fill{background:linear-gradient(90deg,var(--mint),var(--accent),var(--gold));box-shadow:0 0 14px rgba(61,214,224,.4)}
.day-fill{background:linear-gradient(90deg,var(--accent),var(--mint))}
.streak-card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid rgba(255,107,53,.18);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.streak-fire{font-size:40px;flex-shrink:0;line-height:1}
.streak-info{flex:1}
.streak-num{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--fire);letter-spacing:1px;line-height:1}
.streak-num span{font-size:14px;color:var(--dim);font-family:'Noto Sans JP',sans-serif;font-weight:300;letter-spacing:0}
.streak-msg{font-size:11px;color:var(--muted);margin-top:3px}
.streak-ring{flex-shrink:0}
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:16px}
.sec-label:first-child{margin-top:0}
.paste-zone{background:linear-gradient(135deg,rgba(61,214,224,.06),rgba(99,210,184,.03));border:1.5px dashed rgba(61,214,224,.3);border-radius:14px;padding:16px;margin-bottom:12px;transition:.2s}
.paste-zone:focus-within{border-color:var(--accent)}
.paste-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.paste-head-icon{font-size:16px}
.paste-head-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:1px}
.paste-desc{font-size:11px;color:var(--dim);margin-bottom:10px;line-height:1.7}
textarea.paste-input{width:100%;min-height:76px;background:rgba(61,214,224,.04);border:1px solid rgba(61,214,224,.2);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;resize:vertical;line-height:1.7;outline:none;transition:.2s}
textarea.paste-input:focus{border-color:var(--accent);background:rgba(61,214,224,.07)}
textarea.paste-input::placeholder{color:var(--muted)}
.paste-status{margin-top:8px;font-size:12px;min-height:18px;transition:.3s}
.paste-ok{color:var(--ok)}
.paste-err{color:#f87171}
.data-nums{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.data-num{text-align:center}
.data-num-label{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:2px}
.data-num-val{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;letter-spacing:1px}
.data-num-unit{font-size:12px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;background:rgba(61,214,224,.07);border:1px solid rgba(99,210,219,.12);border-radius:99px;padding:3px 10px;font-size:11px;color:var(--dim)}
.meal-section{border-top:1px solid var(--border);padding-top:10px}
.meal-row{font-size:12px;color:var(--dim);margin-bottom:4px;line-height:1.5}
.meal-row b{color:var(--accent)}
.meal-total{font-size:12px;color:var(--warn);font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.05)}
.btn-gold{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#b8840a,#f0c040);color:#07111c;font-weight:700;font-size:14px;cursor:pointer;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;box-shadow:0 5px 20px rgba(240,192,64,.25);transition:.2s;display:block;margin-top:12px}
.btn-gold:active{transform:scale(.98);opacity:.9}
.btn-ok{background:rgba(74,222,128,.15)!important;color:var(--ok)!important;box-shadow:none!important}
.chart-wrap{width:100%;height:130px;position:relative;margin-top:4px}
.chart-svg{width:100%;height:100%}
.hist-item{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.hist-date{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--accent);letter-spacing:1px}
.hist-nums{display:flex;gap:10px}
.hist-num{font-size:13px;color:var(--text);font-weight:500}
.hist-num span{font-size:10px;color:var(--dim)}
.hist-chips{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.hist-meals{border-top:1px solid rgba(99,210,219,.08);padding-top:7px}
.hist-meal-row{font-size:11px;color:var(--dim);margin-bottom:2px}
.empty{text-align:center;padding:32px 14px;border:1px dashed var(--muted);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.9}
/* モチベーションカード */
.motive-bar-track{background:rgba(255,255,255,.05);border-radius:99px;height:10px;overflow:hidden;margin:8px 0 4px}
.motive-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--accent));transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.motive-nums{display:flex;gap:14px;margin-bottom:4px}
.motive-num{text-align:center}
.motive-num-label{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:2px}
.motive-num-val{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;letter-spacing:1px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel.active{animation:fadeUp .25s ease}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.pulse{animation:pulse 2.5s ease infinite}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="app-title">DAVID</div>
    <div class="app-sub">Body Tracker</div>
  </div>
  <div class="header-menu" id="menuLabel">今日：<span id="menuText">読み込み中...</span></div>
</div>

<div class="panel active" id="panel-david">
  <div class="hero-card">
    <div class="hero-body">
      <div class="david-wrap pulse" id="davidSvg"></div>
      <div class="hero-stats">
        <div class="fat-now">
          <div class="fat-label">現在の体脂肪率</div>
          <div class="fat-value" id="fatVal">—<span>%</span></div>
          <div class="fat-remaining">あと<b id="fatRemain">—</b>%でダビデ</div>
        </div>
        <div class="wt-now" id="wtVal">—<span>kg</span></div>
      </div>
    </div>
    <div class="prog-section">
      <div class="prog-row"><span>体脂肪 20%</span><b id="fatPctLabel">0%</b><span>🗿 11.5%</span></div>
      <div class="prog-track fat-track"><div class="prog-fill fat-fill" id="fatBar" style="width:0%"></div></div>
      <div class="prog-row"><span>記録日数</span><span id="daysLabel">0 / 270日</span></div>
      <div class="prog-track day-track"><div class="prog-fill day-fill" id="daysBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="streak-card">
    <div class="streak-fire" id="streakFire">💤</div>
    <div class="streak-info">
      <div class="streak-num" id="streakNum">0<span> 日連続記録</span></div>
      <div class="streak-msg" id="streakMsg">最初の記録をつけよう！</div>
    </div>
    <div class="streak-ring">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="6"/>
        <circle cx="28" cy="28" r="22" fill="none" stroke="var(--fire)" stroke-width="6"
          stroke-dasharray="138.2" id="streakRingFill" stroke-dashoffset="138.2"
          stroke-linecap="round" transform="rotate(-90 28 28)" style="transition:stroke-dashoffset 1s ease"/>
        <text x="28" y="33" text-anchor="middle" fill="var(--fire)" font-size="11" font-weight="700" id="streakRingNum">0</text>
      </svg>
    </div>
  </div>

  <!-- 次のマイルストーンカード -->
  <div class="card" style="margin-bottom:12px">
    <div class="sec-label">🎯 NEXT TARGET</div>
    <div id="milestoneContent"><div style="font-size:12px;color:var(--muted)">記録を追加するとここに表示されます</div></div>
  </div>

  <!-- ペース分析カード -->
  <div class="card" style="margin-bottom:12px">
    <div class="sec-label">📊 PACE ANALYSIS</div>
    <div id="paceContent"><div style="font-size:12px;color:var(--muted)">3日以上記録するとペースが表示されます</div></div>
  </div>

  <!-- グラフカード -->
  <div class="card" style="margin-top:0">
    <div class="sec-label">体脂肪率の推移</div>
    <div class="chart-wrap"><svg class="chart-svg" id="chartSvg" viewBox="0 0 360 110" preserveAspectRatio="none"></svg></div>
  </div>

  <button class="btn-gold" id="btnFeedback">✨ フィードバックデータをコピー</button>
</div>

<div class="panel" id="panel-today">
  <div class="paste-zone">
    <div class="paste-head">
      <span class="paste-head-icon">📋</span>
      <span class="paste-head-title">FITLOGからペースト</span>
    </div>
    <p class="paste-desc">朝の記録・食事・トレーニング、何度貼っても蓄積されます。</p>
    <textarea class="paste-input" id="pasteInput" placeholder="【2026年5月11日（月）】朝の記録&#10;体重：66.0kg　体脂肪率：19.0%&#10;...&#10;ここにペースト"></textarea>
    <div class="paste-status" id="pasteStatus"></div>
  </div>
  <div class="card" id="todayCard" style="display:none">
    <div class="sec-label">今日の記録</div>
    <div class="data-nums" id="todayNums"></div>
    <div class="chips" id="todayChips"></div>
    <div class="meal-section" id="todayMeals" style="display:none"></div>
  </div>
  <div class="empty" id="todayEmpty">
    FITLOGの「クロードにコピー」で<br>コピーした内容を上に貼り付けてください
  </div>
</div>

<div class="panel" id="panel-history">
  <div class="sec-label">記録履歴 <span id="histCount" style="font-weight:300;letter-spacing:0;text-transform:none"></span></div>
  <div id="histList"></div>
  <div class="empty" id="histEmpty" style="display:none">まだ記録がありません</div>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="switchTab('david',this)">
    <span class="nav-icon">🗿</span>
    <span class="nav-label">ダビデへの道</span>
  </button>
  <button class="nav-btn" onclick="switchTab('today',this)">
    <span class="nav-icon">📋</span>
    <span class="nav-label">今日</span>
  </button>
  <button class="nav-btn" onclick="switchTab('history',this)">
    <span class="nav-icon">📜</span>
    <span class="nav-label">履歴</span>
  </button>
</nav>

<script>
const GOAL_FAT=11.5, START_FAT=20, START_WT=66, TOTAL_DAYS=270;
const STORE_KEY='david_app';
const MENU=['完全休養・チートデイ','胸・肩・三頭筋','ランニング','背中・二頭筋・体幹','休養','脚・臀部・腰回り','ランニング'];
const FAT_MILESTONES=[19,18,17,16,15,GOAL_FAT];

function loadData(){try{const v=localStorage.getItem(STORE_KEY);return v?JSON.parse(v):[]}catch{return[]}}
function saveData(logs){try{localStorage.setItem(STORE_KEY,JSON.stringify(logs));return true}catch{return false}}
let logs=loadData();

// ✅ JST対応
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

// ============================================================
// ダビデSVG：体脂肪率で体型が変化
// ============================================================
function davidSVG(pct){
  const t=Math.min(1,Math.max(0,pct/100));
  const L=(a,b)=>a+(b-a)*t;
  const f=n=>n.toFixed(1);

  // ボディ幅（センター60からの半幅）
  // fat(t=0): ウエスト太・腹ぽっこり / lean(t=1): V字シルエット
  const SH=L(23,31);  // 肩幅
  const LA=L(28,34);  // 広背筋
  const BE=L(34,15);  // 腹部（最大の変化ポイント）
  const WA=L(30,13);  // ウエスト
  const HI=L(25,21);  // 腰
  const TH=L(11,10);  // 太もも

  // Y座標（固定）
  const yS=38,yL=53,yB=72,yW=85,yH=101,yK=140,yF=193;

  // ボディパス（左→下→右→上→閉）
  const path=[
    `M ${f(60-SH)} ${yS}`,
    `Q ${f(60-LA)} ${yL} ${f(60-BE)} ${yB}`,
    `Q ${f(60-WA)} ${yW} ${f(60-HI)} ${yH}`,
    `L ${f(60-TH)} ${yK} L ${f(60-TH+1)} ${yF}`,
    `L ${f(60+TH-1)} ${yF} L ${f(60+TH)} ${yK}`,
    `L ${f(60+HI)} ${yH}`,
    `Q ${f(60+WA)} ${yW} ${f(60+BE)} ${yB}`,
    `Q ${f(60+LA)} ${yL} ${f(60+SH)} ${yS}`,
    `Q ${f(60+L(2,-1))} 35 65 34 L 55 34`,
    `Q ${f(60-L(2,-1))} 35 ${f(60-SH)} ${yS} Z`
  ].join(' ');

  // グロー
  const glowPx=(6+t*18).toFixed(0);
  const glowA=(0.18+t*0.57).toFixed(2);
  const strokeA=(0.22+t*0.45).toFixed(2);

  // お腹のたるみライン（高体脂肪時に表示）
  const bellyA=Math.max(0,(0.55-t)*2.2).toFixed(2);
  const broll1=`M ${f(60-BE+4)} 61 Q 60 66 ${f(60+BE-4)} 61`;
  const broll2=`M ${f(60-BE+8)} 50 Q 60 54 ${f(60+BE-8)} 50`;

  // 腹筋ライン（低体脂肪時に表示）
  const absA=Math.max(0,(t-0.45)*2.2).toFixed(2);
  const absW=L(0,8);
  const absH=[62,70,78].map(y=>`M ${f(60-absW)} ${y} L ${f(60+absW)} ${y}`).join(' ');
  const absV=`M 60 58 L 60 87`;

  // 胸筋ライン（低体脂肪時に表示）
  const pecA=Math.max(0,(t-0.35)*1.8).toFixed(2);
  const pecW=L(0,11);
  const lPec=`M ${f(60-pecW+2)} 46 Q ${f(60-pecW-3)} 54 ${f(60-pecW+4)} 61`;
  const rPec=`M ${f(60+pecW-2)} 46 Q ${f(60+pecW+3)} 54 ${f(60+pecW-4)} 61`;

  // 頭（体脂肪高いと少し丸め）
  const hRx=f(L(14,13));

  // ステージラベル
  const labels=['チビデ😅','まだまだ💪','いい感じ🔥','もうすぐ⚡','ダビデ🗿'];
  const label=labels[Math.min(4,Math.floor(t*5))];

  return `<svg viewBox="0 0 120 207" width="82" height="142" style="filter:drop-shadow(0 0 ${glowPx}px rgba(61,214,224,${glowA}))">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dd6e0" stop-opacity="${f(0.28+t*0.62)}"/>
      <stop offset="100%" stop-color="#63d2b8" stop-opacity="${f(0.08+t*0.55)}"/>
    </linearGradient>
  </defs>
  <path d="${path}" fill="url(#dg)" stroke="rgba(61,214,224,${strokeA})" stroke-width="1"/>
  <ellipse cx="60" cy="18" rx="${hRx}" ry="16" fill="url(#dg)" stroke="rgba(61,214,224,${strokeA})" stroke-width="0.8"/>
  <rect x="${f(60-L(7,5.5))}" y="33" width="${f(L(14,11))}" height="6" rx="2" fill="url(#dg)"/>
  <path d="${broll1}" fill="none" stroke="rgba(99,210,184,${bellyA})" stroke-width="1.6" stroke-linecap="round"/>
  <path d="${broll2}" fill="none" stroke="rgba(99,210,184,${bellyA})" stroke-width="1.2" stroke-linecap="round"/>
  <path d="${absH}" fill="none" stroke="rgba(61,214,224,${absA})" stroke-width="1.1" stroke-linecap="round"/>
  <path d="${absV}" fill="none" stroke="rgba(61,214,224,${f(Math.max(0,parseFloat(absA)*0.5))})" stroke-width="0.7"/>
  <path d="${lPec}" fill="none" stroke="rgba(61,214,224,${pecA})" stroke-width="1.1" stroke-linecap="round"/>
  <path d="${rPec}" fill="none" stroke="rgba(61,214,224,${pecA})" stroke-width="1.1" stroke-linecap="round"/>
  <text x="60" y="204" text-anchor="middle" fill="rgba(61,214,224,0.45)" font-size="7" font-family="sans-serif">${label}</text>
</svg>`;
}

// ============================================================
// 次のマイルストーンカード
// ============================================================
function renderMilestone(curFat){
  const el=document.getElementById('milestoneContent');
  const next=FAT_MILESTONES.find(m=>curFat>m);
  if(!next){
    el.innerHTML=`<div style="text-align:center;padding:10px 0">
      <div style="font-size:32px;margin-bottom:6px">🗿</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);letter-spacing:2px">ダビデ達成！</div>
    </div>`;
    return;
  }
  const prevIdx=FAT_MILESTONES.indexOf(next)-1;
  const prev=prevIdx>=0?FAT_MILESTONES[prevIdx]:START_FAT;
  const progress=Math.min(100,Math.max(0,Math.round((prev-curFat)/(prev-next)*100)));
  const remaining=(curFat-next).toFixed(1);
  el.innerHTML=`
    <div style="margin-bottom:10px;display:flex;align-items:baseline;gap:8px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--accent);letter-spacing:1px;line-height:1">${next}<span style="font-size:18px">%</span></div>
      <div style="font-size:12px;color:var(--dim)">突破まで<br><b style="color:var(--gold);font-size:16px">あと${remaining}%</b></div>
    </div>
    <div class="motive-bar-track">
      <div class="motive-bar-fill" style="width:${progress}%"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px">
      <span>${prev}%</span>
      <span style="color:var(--accent);font-weight:700">${progress}% 達成</span>
      <span>${next}%</span>
    </div>`;
}

// ============================================================
// ペース分析カード
// ============================================================
function renderPace(curFat){
  const el=document.getElementById('paceContent');
  const fatLogs=logs.filter(l=>l.fat).sort((a,b)=>a.date.localeCompare(b.date));
  if(fatLogs.length<3){
    const need=3-fatLogs.length;
    el.innerHTML=`<div style="font-size:12px;color:var(--muted);line-height:2">
      あと<b style="color:var(--accent)"> ${need}日分 </b>の体脂肪記録でペース分析が始まります 📊
    </div>`;
    return;
  }
  const recent=fatLogs.slice(-Math.min(10,fatLogs.length));
  const first=recent[0], last=recent[recent.length-1];
  const daysDiff=(new Date(last.date)-new Date(first.date))/86400000;
  if(daysDiff<1){el.innerHTML='<div style="font-size:12px;color:var(--muted)">もう少しデータが必要です</div>';return;}
  const ratePerWeek=((last.fat-first.fat)/daysDiff)*7;
  const ratePerMonth=ratePerWeek*4.33;
  const rateColor=ratePerWeek<-0.05?'var(--ok)':ratePerWeek>0.05?'#f87171':'var(--warn)';
  const sign=ratePerWeek>0?'+':'';

  let goalHTML='';
  if(ratePerWeek<-0.05){
    const weeks=(curFat-GOAL_FAT)/Math.abs(ratePerWeek);
    const gd=new Date();
    gd.setDate(gd.getDate()+Math.round(weeks*7));
    const gs=gd.getFullYear()+'年'+(gd.getMonth()+1)+'月';
    goalHTML=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px">
      このペースなら <b style="color:var(--ok)">${gs}にダビデ達成！</b> 🗿
    </div>`;
  }else if(ratePerWeek>0.05){
    goalHTML=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:#f87171">
      体脂肪が増加傾向です。食事と運動を見直そう！
    </div>`;
  }else{
    goalHTML=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--warn)">
      ほぼ横ばいです。もう一歩頑張ろう！
    </div>`;
  }

  el.innerHTML=`
    <div class="motive-nums">
      <div class="motive-num">
        <div class="motive-num-label">週ペース</div>
        <div class="motive-num-val" style="color:${rateColor}">${sign}${ratePerWeek.toFixed(2)}<span style="font-size:11px;color:var(--dim)">%</span></div>
      </div>
      <div class="motive-num">
        <div class="motive-num-label">月ペース</div>
        <div class="motive-num-val" style="color:${rateColor}">${sign}${ratePerMonth.toFixed(1)}<span style="font-size:11px;color:var(--dim)">%</span></div>
      </div>
      <div class="motive-num">
        <div class="motive-num-label">記録日数</div>
        <div class="motive-num-val" style="color:var(--accent)">${fatLogs.length}<span style="font-size:11px;color:var(--dim)">日</span></div>
      </div>
    </div>
    ${goalHTML}`;
}

function parseLog(text){
  const r={};
  const dm=text.match(/【(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if(dm) r.date=`${dm[1]}-${dm[2].padStart(2,'0')}-${dm[3].padStart(2,'0')}`;
  const wm=text.match(/体重[：:]\s*([\d.]+)\s*kg/); if(wm) r.weight=parseFloat(wm[1]);
  const bm=text.match(/体脂肪率?[：:]\s*([\d.]+)\s*%/); if(bm) r.fat=parseFloat(bm[1]);
  if(text.includes('朝の記録')){
    const sm=text.match(/睡眠[：:]\s*([\d.]+)\s*時間/); if(sm) r.sleep=parseFloat(sm[1]);
    const nm=text.match(/💬[^\n]*\n([^\n]+)/); if(nm&&nm[1].trim()!=='なし') r.note=nm[1].trim();
  }
  if(text.includes('食事記録')){
    // ✅ ☀️に統一
    const emojis=[['🌅','br'],['☀️','lu'],['🌙','di'],['🍪','sn']];
    const stops=['🌅','☀️','🌙','🍪','合計'];
    emojis.forEach(([e,k])=>{
      const idx=text.indexOf(e); if(idx<0) return;
      let end=text.length;
      stops.forEach(s=>{const ni=text.indexOf(s,idx+2);if(ni>idx&&ni<end)end=ni;});
      const chunk=text.slice(idx,end);
      const items=[...chunk.matchAll(/・([^（\n]+)/g)].map(m=>m[1].trim()).filter(Boolean);
      if(items.length) r[k]=items.join('・');
      const kcals=[...chunk.matchAll(/（([\d,]+)\s*kcal）/gi)].map(m=>parseInt(m[1].replace(/,/g,'')));
      if(kcals.length) r[k+'_kcal']=kcals.reduce((a,b)=>a+b,0);
    });
  }
  if(text.includes('トレーニング記録')){
    if(text.includes('ランニング')){
      const m=text.match(/ランニング[：:]\s*([^\n]+)/);
      r.training=m?'ランニング：'+m[1].trim():'ランニング';
    }else{
      const tn=text.match(/💪\s*([^\n]+)/);
      const ex=text.split('\n').filter(l=>/^[✅❌－]/.test(l));
      const ok=ex.filter(l=>l.startsWith('✅')).length;
      r.training=(tn?tn[1].trim():'筋トレ')+`（${ok}/${ex.length}完了）`;
    }
  }
  return r;
}

function calcStreak(){
  const dates=[...new Set(logs.map(l=>l.date))].sort().reverse();
  let n=0;const now=new Date();now.setHours(0,0,0,0);
  for(let i=0;i<dates.length;i++){
    const d=new Date(dates[i]);d.setHours(0,0,0,0);
    const diff=Math.round((now-d)/86400000);
    if(diff===i||diff===i+1)n++;else break;
  }
  return n;
}

function drawChart(){
  const svg=document.getElementById('chartSvg');
  const data=logs.slice(-20).filter(l=>l.fat);
  if(data.length<2){svg.innerHTML='<text x="180" y="60" text-anchor="middle" fill="#2a4a58" font-size="12">2日以上記録するとグラフが表示されます</text>';return;}
  const W=360,H=110,pad={t:10,b:24,l:28,r:10};
  const vals=data.map(l=>l.fat);
  const mn=Math.min(...vals,GOAL_FAT)-0.5,mx=Math.max(...vals)+0.5;
  const x=i=>pad.l+(W-pad.l-pad.r)*i/(data.length-1);
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-mn)/(mx-mn));
  const pts=data.map((l,i)=>`${x(i)},${y(l.fat)}`).join(' ');
  const goalY=y(GOAL_FAT);
  svg.innerHTML=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#63d2b8" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#63d2b8" stop-opacity="0"/>
  </linearGradient></defs>
  <line x1="${pad.l}" y1="${goalY}" x2="${W-pad.r}" y2="${goalY}" stroke="#f0c040" stroke-width="1" stroke-dasharray="4,3" opacity=".5"/>
  <text x="${W-pad.r-2}" y="${goalY-3}" fill="#f0c040" font-size="8" text-anchor="end">目標</text>
  <polygon points="${x(0)},${H-pad.b} ${pts} ${x(data.length-1)},${H-pad.b}" fill="url(#cg)"/>
  <polyline points="${pts}" fill="none" stroke="#63d2b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  ${data.map((l,i)=>`<circle cx="${x(i)}" cy="${y(l.fat)}" r="3" fill="#63d2b8"/>`).join('')}
  ${data.map((l,i)=>`<text x="${x(i)}" y="${H-pad.b+14}" text-anchor="middle" fill="#2a4a58" font-size="9">${l.date.slice(5).replace('-','/')}</text>`).join('')}`;
}

function buildReport(){
  const cur=logs.find(l=>l.date===todayStr())||logs[logs.length-1];
  if(!cur) return '記録がありません';
  const hist=logs.slice(-6).filter(l=>l.date!==cur.date).map(l=>`${l.date}:${l.weight||'-'}kg/${l.fat||'-'}%`).join(' / ');
  return [
    `【${cur.date}】今日のデータ`,
    cur.weight&&`⚖️ 体重：${cur.weight}kg`,
    cur.fat&&`📊 体脂肪率：${cur.fat}%`,
    cur.sleep&&`😴 睡眠：${cur.sleep}時間`,
    cur.br&&`🌅 朝：${cur.br}`,
    cur.lu&&`☀️ 昼：${cur.lu}`,
    cur.di&&`🌙 夜：${cur.di}`,
    cur.sn&&`🍪 間食：${cur.sn}`,
    cur.kcal&&`🔥 合計：${cur.kcal.toLocaleString()}kcal`,
    cur.training&&`💪 ${cur.training}`,
    cur.note&&`💬 ${cur.note}`,
    `\n📅 過去データ：${hist||'初回'}`,
  ].filter(Boolean).join('\n');
}

function render(){
  const latest=logs.length?logs[logs.length-1]:null;
  const streak=calcStreak();
  const curFat=latest?.fat??START_FAT;
  const curWt=latest?.weight??START_WT;
  const fatPct=Math.min(100,Math.round(((START_FAT-curFat)/(START_FAT-GOAL_FAT))*100));
  const daysPct=Math.min(100,Math.round((logs.length/TOTAL_DAYS)*100));
  document.getElementById('menuText').textContent=MENU[new Date().getDay()];
  document.getElementById('davidSvg').innerHTML=davidSVG(fatPct);
  document.getElementById('fatVal').innerHTML=`${curFat}<span>%</span>`;
  document.getElementById('fatRemain').textContent=Math.max(0,curFat-GOAL_FAT).toFixed(1);
  document.getElementById('wtVal').innerHTML=`${curWt}<span>kg</span>`;
  document.getElementById('fatPctLabel').textContent=`${fatPct}% 達成`;
  document.getElementById('fatBar').style.width=fatPct+'%';
  document.getElementById('daysLabel').textContent=`${logs.length} / ${TOTAL_DAYS}日`;
  document.getElementById('daysBar').style.width=daysPct+'%';
  const fire=streak>=7?'🔥🔥🔥':streak>=3?'🔥🔥':streak>=1?'🔥':'💤';
  const msg=streak===0?'最初の記録をつけよう！':streak<3?'いいスタート！':streak<7?'この調子！':streak<14?'1週間突破！':'圧倒的継続力！';
  document.getElementById('streakFire').textContent=fire;
  document.getElementById('streakNum').innerHTML=`${streak}<span> 日連続記録</span>`;
  document.getElementById('streakMsg').textContent=msg;
  const ringCirc=138.2,offset=ringCirc*(1-Math.min(streak/30,1));
  document.getElementById('streakRingFill').style.strokeDashoffset=offset;
  document.getElementById('streakRingNum').textContent=streak;
  document.getElementById('streakRingFill').setAttribute('stroke',streak===0?'#2a4a58':'var(--fire)');

  // モチベーションカード更新
  renderMilestone(curFat);
  renderPace(curFat);

  drawChart();

  // ✅ todayStr()でJST正確に今日を判定
  const today=todayStr();
  const cur=logs.find(l=>l.date===today);
  const hasData=cur&&(cur.weight||cur.fat||cur.training||cur.br);
  document.getElementById('todayCard').style.display=hasData?'block':'none';
  document.getElementById('todayEmpty').style.display=hasData?'none':'block';
  if(hasData) renderToday(cur);
  renderHistory();
}

function renderToday(log){
  const nums=[];
  if(log.weight) nums.push(`<div class="data-num"><div class="data-num-label">体重</div><div class="data-num-val" style="color:var(--accent)">${log.weight}<span class="data-num-unit">kg</span></div></div>`);
  if(log.fat)    nums.push(`<div class="data-num"><div class="data-num-label">体脂肪率</div><div class="data-num-val" style="color:var(--mint)">${log.fat}<span class="data-num-unit">%</span></div></div>`);
  if(log.sleep)  nums.push(`<div class="data-num"><div class="data-num-label">睡眠</div><div class="data-num-val" style="color:#60c8e8">${log.sleep}<span class="data-num-unit">h</span></div></div>`);
  if(log.kcal)   nums.push(`<div class="data-num"><div class="data-num-label">カロリー</div><div class="data-num-val" style="color:var(--warn)">${log.kcal.toLocaleString()}<span class="data-num-unit">kcal</span></div></div>`);
  document.getElementById('todayNums').innerHTML=nums.join('');
  const chips=[];
  if(log.training) chips.push(`<span class="chip">💪 ${log.training}</span>`);
  document.getElementById('todayChips').innerHTML=chips.join('');
  const meals=[];
  if(log.br) meals.push(`<div class="meal-row"><b>🌅 朝</b>　${log.br}</div>`);
  if(log.lu) meals.push(`<div class="meal-row"><b>☀️ 昼</b>　${log.lu}</div>`);
  if(log.di) meals.push(`<div class="meal-row"><b>🌙 夜</b>　${log.di}</div>`);
  if(log.sn) meals.push(`<div class="meal-row"><b>🍪 間食</b>　${log.sn}</div>`);
  if(log.kcal) meals.push(`<div class="meal-total">合計：${log.kcal.toLocaleString()} kcal</div>`);
  const ms=document.getElementById('todayMeals');
  if(meals.length){ms.style.display='block';ms.innerHTML=meals.join('');}
  else ms.style.display='none';
}

function renderHistory(){
  const list=document.getElementById('histList');
  const empty=document.getElementById('histEmpty');
  document.getElementById('histCount').textContent=logs.length+'件';
  if(!logs.length){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  list.innerHTML=[...logs].reverse().map(l=>{
    const nums=[];
    if(l.weight) nums.push(`<span class="hist-num">${l.weight}<span>kg</span></span>`);
    if(l.fat)    nums.push(`<span class="hist-num">${l.fat}<span>%</span></span>`);
    const chips=[];
    if(l.training) chips.push(`<span class="chip">💪 ${l.training}</span>`);
    if(l.kcal)     chips.push(`<span class="chip">🔥 ${l.kcal.toLocaleString()}kcal</span>`);
    if(l.sleep)    chips.push(`<span class="chip">😴 ${l.sleep}h</span>`);
    const meals=[];
    if(l.br) meals.push(`<div class="hist-meal-row">🌅 ${l.br}</div>`);
    if(l.lu) meals.push(`<div class="hist-meal-row">☀️ ${l.lu}</div>`);
    if(l.di) meals.push(`<div class="hist-meal-row">🌙 ${l.di}</div>`);
    if(l.sn) meals.push(`<div class="hist-meal-row">🍪 ${l.sn}</div>`);
    return `<div class="hist-item">
      <div class="hist-head"><span class="hist-date">${l.date}</span><div class="hist-nums">${nums.join('')}</div></div>
      ${chips.length?`<div class="hist-chips">${chips.join('')}</div>`:''}
      ${meals.length?`<div class="hist-meals">${meals.join('')}</div>`:''}
    </div>`;
  }).join('');
}

document.getElementById('pasteInput').addEventListener('input',function(){
  const text=this.value;
  if(!text.trim()) return;
  const r=parseLog(text);
  const has=r.weight||r.fat||r.training||r.br||r.br_kcal||r.lu||r.lu_kcal||r.di||r.di_kcal||r.sn||r.sn_kcal;
  if(!has) return;
  const date=r.date||todayStr();
  const existing=logs.find(l=>l.date===date)||{date};
  const merged={...existing,...r};
  const totalKcal=(merged.br_kcal||0)+(merged.lu_kcal||0)+(merged.di_kcal||0)+(merged.sn_kcal||0);
  if(totalKcal>0) merged.kcal=totalKcal;
  const idx=logs.findIndex(l=>l.date===date);
  if(idx>=0) logs[idx]=merged; else logs.push(merged);
  logs.sort((a,b)=>a.date.localeCompare(b.date));
  const ok=saveData(logs);
  const st=document.getElementById('pasteStatus');
  st.className='paste-status paste-ok';
  st.textContent=ok?'✅ 保存しました！':'⚠️ 保存に失敗しました';
  render();
  const self=this;
  setTimeout(()=>{self.value='';st.textContent='';},2500);
});

document.getElementById('btnFeedback').addEventListener('click',function(){
  const text=buildReport();
  const btn=this;
  const done=()=>{
    btn.textContent='✅ コピーしました！フィードバックチャットに貼り付けてください';
    btn.classList.add('btn-ok');
    setTimeout(()=>{btn.textContent='✨ フィードバックデータをコピー';btn.classList.remove('btn-ok');},3500);
  };
  try{navigator.clipboard.writeText(text).then(done);}
  catch{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    done();
  }
});

function switchTab(name,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
}

render();
</script>
